<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>RUMOR · Prof. Ailson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root { --night:#060c1f; --navy:#16244d; --blue:#26407a; --yellow:#ffc83d; --pink:#ff4fa3; --cyan:#6fd3ff; --paper:#efe8d6; }
html, body, #canvas { margin:0; padding:0; border:0; }
body { color:white; background:var(--night); overflow:hidden; touch-action:none; height:100vh; height:100dvh; }
#canvas { display:block; }
#canvas:focus { outline:none; }

/* tela de carregamento noir */
#cover { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: radial-gradient(circle at 78% 14%, rgba(255,200,61,.22), transparent 22%), linear-gradient(#26407a, #0b1430 55%, #060c1f);
  overflow:hidden; font-family:'Special Elite', monospace; transition: opacity .6s; }
#cover.hide { display:none; }
/* ao tocar em entrar tudo para de animar: o navegador fica livre para iniciar o jogo */
#cover.still *, #cover.still::before { animation: none !important; transition: none !important; }
#cover.still .rain { display:none; }
/* retícula de quadrinho */
#cover::before { content:""; position:absolute; inset:0; background-image: radial-gradient(rgba(0,0,0,.35) 1.2px, transparent 1.6px);
  background-size: 7px 7px; opacity:.5; pointer-events:none; }
/* chuva */
.rain { position:absolute; inset:-20% 0 0 0; pointer-events:none; }
.rain i { position:absolute; top:-20%; width:1.5px; height:90px; background:linear-gradient(transparent, rgba(160,190,255,.55));
  animation: fall linear infinite; transform: rotate(14deg); will-change: transform; }
@keyframes fall { to { transform: translateY(140vh) rotate(14deg); } }
/* poste de luz */
.lamp { position:absolute; right:12%; top:0; width:42vmin; height:70vmin; background: radial-gradient(ellipse at 50% 0, rgba(255,210,120,.28), transparent 65%);
  clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%); animation: flicker 6s infinite; pointer-events:none; }
@keyframes flicker { 0%,100%{opacity:1} 47%{opacity:1} 48%{opacity:.4} 49%{opacity:1} 70%{opacity:.85} }

.logo { position:relative; font-family:'Bebas Neue', Impact, sans-serif; font-size: clamp(88px, 26vmin, 200px); line-height:.9; letter-spacing:.02em;
  color:var(--yellow); text-shadow: 6px 3px 0 rgba(255,79,163,.85), -4px -2px 0 rgba(111,211,255,.6); animation: glitch 4s infinite; }
@keyframes glitch { 0%,92%,100% { transform:none; } 93% { transform: translateX(-6px) skewX(-6deg); } 95% { transform: translateX(5px); } 97% { transform:none; } }
.tag { position:relative; font-size: clamp(16px, 4.6vmin, 26px); color:var(--paper); margin-top:6px; text-shadow: 0 2px 6px #000; }
.seal { position:relative; margin-top:22px; background:var(--paper); color:#1b2140; padding:10px 22px 8px; transform: rotate(-3deg);
  box-shadow: 6px 8px 0 rgba(0,0,0,.4); text-align:center; }
.seal small { display:block; font-size:12px; opacity:.7; letter-spacing:.12em; }
.seal b { font-family:'Bebas Neue', Impact, sans-serif; font-weight:normal; font-size: clamp(28px, 7vmin, 44px); color:#e2384f; letter-spacing:.03em; }
.seal::after { content:""; position:absolute; left:50%; top:-12px; width:90px; height:22px; margin-left:-45px; background:rgba(255,255,230,.6); transform: rotate(4deg); }

.loader { position:relative; width: min(78vw, 460px); margin-top:38px; }
.bar { height:16px; border:3px solid var(--paper); background: rgba(0,0,0,.45); box-shadow: 4px 5px 0 rgba(0,0,0,.4); overflow:hidden; }
.bar > div { height:100%; width:0%; background: repeating-linear-gradient(-45deg, var(--yellow) 0 14px, #e8b02f 14px 28px); transition: width .25s; animation: slide 1s linear infinite; background-size: 40px 40px; }
@keyframes slide { to { background-position: 40px 0; } }
.status { display:flex; justify-content:space-between; font-size:14px; color:var(--paper); margin-top:8px; opacity:.85; }
.tip { position:relative; margin-top:26px; width:min(84vw, 520px); min-height:58px; background: rgba(6,12,31,.75); border-left:5px solid var(--yellow);
  padding:12px 16px; font-size: clamp(14px, 3.8vmin, 18px); color:var(--paper); line-height:1.35; }
.tip span { color: var(--yellow); }
#enter { position:relative; display:none; margin-top:34px; font-family:'Bebas Neue', Impact, sans-serif; font-size: clamp(28px, 7.5vmin, 46px); letter-spacing:.04em;
  color:#05091a; background:var(--yellow); border:0; padding:16px 38px 12px; cursor:pointer; box-shadow: 6px 7px 0 rgba(0,0,0,.45); animation: pulse 1.4s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
#enter:active { transform: translateY(3px); box-shadow: 3px 4px 0 rgba(0,0,0,.45); }
#err { position:relative; display:none; margin-top:24px; color:#ffb3c2; max-width:80vw; text-align:center; }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="theme-color" content="#060c1f"><style>body{background:#060c1f}</style>
</head>
<body>
<canvas id="canvas">Seu navegador não suporta o jogo.</canvas>
<noscript>Ative o JavaScript para jogar.</noscript>

<div id="cover">
  <div class="rain" id="rain"></div>
  <div class="lamp"></div>
  <div class="logo">RUMOR</div>
  <div class="tag">Nada começa como parece.</div>
  <div class="seal"><small>UMA INVESTIGAÇÃO DO</small><b>PROF. AILSON</b></div>
  <div class="loader" id="loader">
    <div class="bar"><div id="fill"></div></div>
    <div class="status"><span id="label">Abrindo o arquivo do caso...</span><span id="pct">0%</span></div>
  </div>
  <div class="tip" id="tip"></div>
  <button id="enter">TOQUE PARA ENTRAR NO CASO</button>
  <div id="err"></div>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":23470320,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
  // chuva em CSS (leve)
  const rain = document.getElementById('rain');
  for (let i = 0; i < 36; i++) {
    const d = document.createElement('i');
    d.style.left = (Math.random() * 110 - 5) + '%';
    d.style.animationDuration = (0.6 + Math.random() * 0.7) + 's';
    d.style.animationDelay = (-Math.random() * 2) + 's';
    d.style.opacity = (0.3 + Math.random() * 0.6).toFixed(2);
    rain.appendChild(d);
  }
  // dicas de detetive enquanto carrega
  const tips = [
    '<span>Dica de detetive:</span> o culpado quase nunca é quem todo mundo está acusando.',
    '<span>Dica de detetive:</span> cada aluno da equipe recebe pistas que só ele vê. Conversem!',
    '<span>Dica de detetive:</span> mostre a pista certa para a pessoa certa e ela abre o jogo.',
    '<span>Dica de detetive:</span> um fio sem prova no quadro é só um palpite.',
    '<span>Dica de detetive:</span> confira os horários. Mentira tem perna curta e relógio errado.',
    '<span>Dica de detetive:</span> leia a história que o seu quadro conta antes de acusar alguém.',
  ];
  const tipEl = document.getElementById('tip');
  let ti = Math.floor(Math.random() * tips.length);
  const showTip = () => { tipEl.innerHTML = tips[ti % tips.length]; ti++; };
  showTip();
  const tipTimer = setInterval(showTip, 4200);
  const labels = ['Abrindo o arquivo do caso...', 'Revirando os armários...', 'Interrogando testemunhas...', 'Pendurando o barbante vermelho...', 'Revelando as fotos...'];
  let li = 0;
  const labelEl = document.getElementById('label');
  const labelTimer = setInterval(() => { labelEl.textContent = labels[++li % labels.length]; }, 1800);

  const fill = document.getElementById('fill');
  const pct = document.getElementById('pct');
  const cover = document.getElementById('cover');
  const enter = document.getElementById('enter');
  const err = document.getElementById('err');
  const fail = (e) => { console.error(e); err.style.display = 'block'; err.textContent = 'Não foi possível abrir o jogo: ' + (e && e.message ? e.message : e) + '. Recarregue a página.'; };

  // botão voltar do celular/navegador, fechar ou recarregar a aba: o navegador pede confirmação
  // (evita sair da partida sem querer). Só depois que o jogo abriu.
  function guardExit() {
    const onUnload = (e) => { e.preventDefault(); e.returnValue = ''; return ''; };
    window.addEventListener('beforeunload', onUnload);
    history.pushState({ rumor: 1 }, '');
    window.addEventListener('popstate', () => {
      if (window.confirm('Sair do RUMOR? A partida continua sem você. Para voltar, entre de novo com o mesmo código e o mesmo nome.')) {
        window.removeEventListener('beforeunload', onUnload);
        history.back();
      } else {
        history.pushState({ rumor: 1 }, '');
      }
    });
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) { fail('o navegador não tem: ' + missing.join(', ')); return; }

  // 1) baixa tudo mostrando o progresso; 2) espera o TOQUE (libera o som do navegador); 3) inicia
  const exe = GODOT_CONFIG['executable'];
  const pack = GODOT_CONFIG['mainPack'] || (exe + '.pck');
  engine.config.update({
    onProgress: function (current, total) {
      if (current > 0 && total > 0) {
        const p = Math.min(100, Math.round(current / total * 100));
        fill.style.width = p + '%';
        pct.textContent = p + '%';
      }
    },
  });
  engine.config.args = ['--main-pack', pack].concat(engine.config.args || []);
  Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(function () {
    clearInterval(labelTimer);
    fill.style.width = '100%';
    pct.textContent = '100%';
    labelEl.textContent = 'Caso pronto.';
    enter.style.display = 'block';
    const go = function () {
      enter.disabled = true;
      enter.textContent = 'ENTRANDO...';
      clearInterval(tipTimer);
      cover.classList.add('still');
      // o toque destrava o áudio: a trilha já começa no menu
      try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { const ac = new AC(); ac.resume(); setTimeout(() => ac.close(), 500); } } catch (e) {}
      // espera a tela desenhar o "ENTRANDO..." antes do trabalho pesado de iniciar
      requestAnimationFrame(() => setTimeout(() => {
        engine.start().then(function () { cover.remove(); guardExit(); }, fail);
      }, 30));
    };
    enter.addEventListener('click', go, { once: true });
  }, fail);
}());
</script>
</body>
</html>
